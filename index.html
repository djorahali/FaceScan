
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceScan</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;padding:25px;
}
h1{text-align:center;color:#48d9c0}
.card{
 background:#1d293b;padding:20px;
 border-radius:18px;margin-top:25px;
}
input,button{
 width:100%;padding:15px;margin-top:12px;
 border:0;border-radius:10px;font-size:16px;
}
button{background:#19bda5;color:#071b20;font-weight:bold}
video{
 width:100%;border-radius:14px;
 background:#000;margin-top:15px;
}
#status{text-align:center;color:#48d9c0;margin-top:15px}
</style>
</head>
<body>
<h1>FaceScan</h1>
<p style="text-align:center">Smart Face Detection System</p>

<div class="card">
<h2>Access Code</h2>
<input id="pin" type="password"
inputmode="numeric" maxlength="5"
placeholder="Enter 5 digit code">
<button onclick="login()">LOGIN</button>
<p id="message"></p>
</div>

<div class="card" id="scanner" hidden>
<h2>Face Scanner</h2>
<video id="camera" autoplay playsinline muted></video>
<button onclick="startCamera()">START FACE SCAN</button>
<button onclick="stopCamera()">STOP CAMERA</button>
<p id="status">Camera is waiting...</p>
</div>

<script>
let stream=null;

function login(){
 const pin=document.getElementById('pin').value;
 if(pin.length!==5 || !/^\d{5}$/.test(pin)){
  document.getElementById('message').textContent=
  'Enter exactly 5 digits';
  return;
 }
 document.getElementById('message').textContent=
 'Access granted';
 document.getElementById('scanner').hidden=false;
}

async function startCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'user'},audio:false
  });
  document.getElementById('camera').srcObject=stream;
  document.getElementById('status').textContent=
   'Camera active. Position your face in view.';
 }catch(e){
  document.getElementById('status').textContent=
   'Camera permission denied or unavailable.';
 }
}

function stopCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 document.getElementById('camera').srcObject=null;
 document.getElementById('status').textContent='Camera stopped';
}
</script>
</body>
</html>
